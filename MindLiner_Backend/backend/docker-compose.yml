version: '3.8'

services:
  db:
    image: postgres:15
    container_name: mindline-postgres
    environment:
      POSTGRES_USER: mindline_user
      POSTGRES_PASSWORD: mindline_password
      POSTGRES_DB: mindline_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: